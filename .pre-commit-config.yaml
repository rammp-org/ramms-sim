repos:
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v14.0.6
    hooks:
    -   id: clang-format
        exclude: |
          (?x)(
          ^Plugins/
          )
        types_or: [c++, c]
-   repo: local
    hooks:
    -   id: no-private-content
        name: public Config, Content and Source name nothing under /RammsPrivateAssets/
        entry: python Scripts/check_no_private_refs.py
        language: python
        files: ^(Config|Content|Source)/
