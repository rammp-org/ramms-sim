+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsCore.RammsRobotControlSurfaceComponent",FunctionName="GetControlTarget",bAllowChildClasses=False)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsCore.RammsRobotControlSurfaceComponent",FunctionName="GetControlText",bAllowChildClasses=False)
