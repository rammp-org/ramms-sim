; Lets build_supermarket.py do EVERYTHING from one script: its shelf-solidify step runs a
; tiny editor-Python command over Remote Control, and RC blocks PythonScriptLibrary by
; default (see FRemoteControlModule::CanBeAccessedRemotely). Enabling this lifts that block.
; Ships with the project, so the whole team inherits it — no per-user setup. Localhost dev use.
;
; (Both section spellings are written; only the one matching the engine version's module
;  registration takes effect, the other is harmless/ignored.)
[/Script/RemoteControlCommon.RemoteControlSettings]
bEnableRemotePythonExecution=True

[/Script/RemoteControl.RemoteControlSettings]
bEnableRemotePythonExecution=True
