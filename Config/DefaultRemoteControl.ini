; Remote Control API (HTTP :30010 / WS :30020) — how ramms-tools and other external programs drive
; the sim. Since UE 5.6 a remote function call is refused unless its class (or class+function) is
; allow-listed here; bAllowAnyRemoteFunctionCall stays off. Add an entry when ramms-tools gains a
; new call target: ClassPath is the reflected class, FunctionName (optional) the UFUNCTION name,
; bAllowChildClasses whether Blueprint subclasses count.
[/Script/RemoteControlCommon.RemoteControlSettings]
bAllowAnyRemoteFunctionCall=False
; RAMMS function-library bridges (static entry points, no child classes).
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsCore.RammsCoreBridge",bAllowChildClasses=False)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsUI.RammsRemoteBridge",bAllowChildClasses=False)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsWorldGen.RammsWorldGenBridge",bAllowChildClasses=False)
; World generation actors (Blueprint subclasses allowed).
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsWorldGen.RammsWorldGenerator",bAllowChildClasses=True)
; Robot controller components (ramms-kinova, ramms-mebot, ramms-gripper, ramms-pose, ramms-tui).
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsCore.KinovaGen3ControllerComponent",bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsCore.MebotControllerComponent",bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsCore.GripperControllerComponent",bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/RammsCore.RammsSkeletalPoseComponent",bAllowChildClasses=True)
; Engine getters used by ramms-imu (read-only pose / velocity queries).
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.Actor",FunctionName="K2_GetActorLocation",bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.Actor",FunctionName="K2_GetActorRotation",bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.Actor",FunctionName="GetVelocity",bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.SceneComponent",FunctionName="GetSocketTransform",bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.SceneComponent",FunctionName="GetSocketLocation",bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.SceneComponent",FunctionName="GetSocketRotation",bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.PrimitiveComponent",FunctionName="GetPhysicsLinearVelocity",bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.PrimitiveComponent",FunctionName="GetPhysicsAngularVelocityInDegrees",bAllowChildClasses=True)
; Editor-side fallback used by UnrealRemote.find_actors when RammsCore is absent.
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/UnrealEd.EditorActorSubsystem",FunctionName="GetAllLevelActors",bAllowChildClasses=False)
