[/Script/RammsUI.RammsControlHUDSettings]
bDepthColormapRepeat=True
DepthColormapMaxMetres=10.000000
DepthColormapIndex=2
DepthColormapMinMetres=0.100000


[/Script/UnrealEd.ProjectPackagingSettings]
; Palettes and the meshes they point at are only reached through soft references (presets, SetPalette),
; so a packaged build has to cook them explicitly. /Game/UrbanVerse and /Game/SimReady exist once
; Tools/urbanverse_fetch.py / Tools/simready_fetch.py have run.
+DirectoriesToAlwaysCook=(Path="/RammsWorldGen/Palettes")
+DirectoriesToAlwaysCook=(Path="/Game/UrbanVerse")
+DirectoriesToAlwaysCook=(Path="/Game/SimReady")

[/Script/CameraCapture.CameraCaptureSegmentationSettings]
; Segmentation classes for RAMMS (fine -> coarse). Values are pinned so masks from different runs agree;
; add new classes at the end with the next free value. RammsWorldGen tags generated worlds with these
; names (URammsSegmentationLabels).
TagPrefix=seg:
DefaultCoarseClass=other
+ActorClassRules=(ActorClass="/Game/Fab/CitySampleCrowd/Blueprints/BP_CrowdCharacter.BP_CrowdCharacter_C",Class="Person")
