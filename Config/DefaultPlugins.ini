; ZoneGraph + MassCrowd settings for the RammsCrowd NPC crowd system.
; Tag bits: 0=Default, 1=Crowd (crowd-navigable lanes), 2=Sidewalk, 3=Crossing,
; 4=OpenArea, 5=DensityStd (lane density descriptor used for wander-target weighting).

[/Script/ZoneGraph.ZoneGraphSettings]
Tags[0]=(Name="Default",Color=(R=113,G=129,B=81,A=255),Tag=(Bit=0))
Tags[1]=(Name="Crowd",Color=(R=255,G=160,B=0,A=255),Tag=(Bit=1))
Tags[2]=(Name="Sidewalk",Color=(R=96,G=160,B=255,A=255),Tag=(Bit=2))
Tags[3]=(Name="Crossing",Color=(R=255,G=64,B=64,A=255),Tag=(Bit=3))
Tags[4]=(Name="OpenArea",Color=(R=64,G=255,B=128,A=255),Tag=(Bit=4))
Tags[5]=(Name="DensityStd",Color=(R=200,G=200,B=200,A=255),Tag=(Bit=5))
; Two-way pedestrian sidewalk: one 150 cm lane each direction.
; Lane tag mask 39 = Default(1) | Crowd(2) | Sidewalk(4) | DensityStd(32).
+LaneProfiles=(Name="PedestrianLanes",ID=8A3C5B1E4F2D47A9B6E1C0D2F3A4B5C6,Lanes=((Width=150.000000,Direction=Forward,Tags=(Mask=39)),(Width=150.000000,Direction=Backward,Tags=(Mask=39))))
; Generated levels (RammsWorldGen crowd.py), same tags. Narrow lanes so a lane fits the clear part of a
; sidewalk or a doorway (agents follow lane centres; avoidance does not steer around static geometry).
; Sidewalks: two 60 cm lanes. Indoors: two 25 cm lanes (one person each way through an 80 cm door).
+LaneProfiles=(Name="PedestrianLanesSidewalk",ID=7B1D4C9E2A3F4B5C8D6E0F1A2B3C4D5E,Lanes=((Width=60.000000,Direction=Forward,Tags=(Mask=39)),(Width=60.000000,Direction=Backward,Tags=(Mask=39))))
+LaneProfiles=(Name="PedestrianLanesNarrow",ID=5D2E8B7A1C4F4E3B9A6D0C1E2F3B4A57,Lanes=((Width=25.000000,Direction=Forward,Tags=(Mask=39)),(Width=25.000000,Direction=Backward,Tags=(Mask=39))))

