; ZoneGraph + MassCrowd settings for the RammsCrowd NPC crowd system and its Mass traffic.
; Tag bits: 0=Default, 1=Crowd (crowd-navigable lanes), 2=Sidewalk, 3=Crossing (a street crossing a traffic
; signal opens and closes: MassCrowd's CrossingTag; MassCrowd closes these lanes until something opens them),
; 4=OpenArea, 5=DensityStd (lane density descriptor used for wander-target weighting), 6=Vehicle (traffic
; lanes), 7=Intersection (an intersection's turning lanes: stop or signal control), 8=Signalized (an
; intersection run by the traffic signal clock).

